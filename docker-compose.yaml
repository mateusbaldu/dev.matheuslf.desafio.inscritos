services:
  postgres-db:
    image: postgres:17
    container_name: inscritos-db
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  app:
    build: .
    container_name: inscritos-api
    depends_on:
      - postgres-db
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}

      - SPRING_JPA_GENERATE_DDL=true
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_SQL_INIT_MODE=always
      - SERVER_ERROR_INCLUDE_STACKTRACE=never

      - JWT_PUBLIC_KEY=file:/app/keys/app.pub
      - JWT_PRIVATE_KEY=file:/app/keys/app.key
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge

